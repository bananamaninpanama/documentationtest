<!DOCTYPE html>
<html>
  <body>
    <style>
      body {
          background-color: black;
          margin: 0;
          padding: 0;
      }
      html {
          margin: 0;
          padding: 0;
      }
      .selectablekey {
          font-family: Arial;
          font-weight: 600;
          text-decoration: none;
          overflow: auto;
      }
      .selectablekey:link {
          color: #55eeee;
          overflow: auto;
      }
      .selectedkey:link {
          color: magenta;
          font-weight: bold;
          overflow: auto;
      }
      .listofkeys {
          color: black;
      }
      .box {
          overflow: auto;
          white-space: nowrap;
          border-color:#333333;
          padding: 5px;
          background-color: black;
          color: white;
          box-sizing: border-box;
          height: auto;
          border: 2px solid #333;
          border-radius: 7px;
      }
      .fileselector {
        background-color: #414c61;
        border-color: #456141;
      }
      .fileselector:hover {
        background-color: #333;
      }
    </style>
    <script src="script.js" defer></script>
    <div
      class="box"
      style="border-radius: 0px; background-color: #190631; height: 100vh; width: 100vw; border: 1px solid #250129;"
    >
      <div style="display: flex; flex-direction: column; height: 100%;">
        <div id="filestuff" class="box" style="width: 100%;">
          <div id="samelinething" style="display: flex;">
            <input
              id="jsonFile"
              type="file"
              accept=".json"
              style="color: blue;"
              hidden
            />
            <label
              for="jsonFile"
              class="box fileselector"
              style="padding: 10px 20px; display: inline-block; font-family: sans-serif; font-weight: bold; overflow: visible;">
              Upload
            </label>
          </div>
        </div>
        <div style="flex-grow: 1">
          <div style="display: flex; flex-direction: row;  height: 100%">
            <div id="listofkeys" class="box" style="width: 30%;"></div>
            <div class="box" style="width: 70%;" id="descholder"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
